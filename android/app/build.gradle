android {
    namespace 'com.example.tvs'
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.example.tvs"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 4006
        versionName "1.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt']
        }
    }
    lint {
        checkReleaseBuild false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.fragment:fragment:1.7.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.window:window-extensions-core:1.3.0'
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'androidx.interpolator:interpolator:1.0.1'
    implementation 'androidx.customview:customview:1.2.0-alpha02'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.tracing:tracing:1.0.0'
    implementation 'androidx.annotation:annotation:1.8.0'

    // Flutter embedding
    implementation project(':flutter')

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.8.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'

    // Audio service
    implementation 'com.ryanheise:audio-service:11.0.6'

    // Share plus
    implementation 'dev.fluttercommunity.plus:share_plus:7.0.2'

    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:espresso-core:3.5.1'
}