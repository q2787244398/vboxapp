name: tvs
description: TVS - A CatVod-based video player app with embedded Node.js spider engine.
publish_to: 'none'
version: 1.2.2+7
environment:
  sdk: '>=3.0.0 <4.0.0'

# 依赖按「Dart 源码实际 import」精简。
# 逆向重建出的 pubspec 里另有 13 个依赖从未被任何文件导入，
# 它们只会给四端原生构建增加失败面（每个插件都需要 Android/iOS/macOS/Windows
# 的平台实现），因此移除。如后续需要，取消注释并按 pub.dev 真实版本声明即可：
#
#   audio_service, audio_session, share_plus, wakelock_plus, webview_flutter,
#   flutter_secure_storage, connectivity_plus, device_info_plus,
#   package_info_plus, permission_handler, url_launcher, screen_brightness
#
# 版本号已全部核对 pub.dev API，确保真实存在且与当前 Flutter stable 兼容。
dependencies:
  flutter:
    sdk: flutter

  # CupertinoIcons 字体由本包提供。虽然源码里没有直接 import，
  # 但 material_ui / cupertino_ui 等依赖会引用
  # 'packages/cupertino_icons/CupertinoIcons' 字体族，缺少它会导致
  # release 构建的图标 tree-shaking 失败（IconTreeShakerException）。
  cupertino_icons: ^1.0.8

  go_router: ^18.0.2
  provider: ^6.1.5
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4

  # Video player (federated plugin; Android + Apple backends)
  yl_player:
    path: ../packages/yl_player

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/js/node-main-template.js
    - assets/js/config-center-dpad.js
    - assets/js/node-intl-polyfill.js
    - assets/images/logo.png

# 说明：此前这里用 assets/fonts/MaterialIcons-Regular.otf（仅 99 个字形的
# 子集字体）覆盖了 MaterialIcons 字体族，导致 release 构建的图标
# tree-shaking 因缺少 Icons.search_outlined(0xF34B) 等码位而失败
# （IconTreeShakerException: Font subsetting failed）。
# 标准 Flutter 工程无需显式声明该字体，uses-material-design: true 已让
# Flutter 注入 SDK 中完整的 MaterialIcons 字体，字形齐全且可正常子集化。
