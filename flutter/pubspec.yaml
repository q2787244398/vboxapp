name: tvs
description: TVS - A CatVod-based video player app with embedded Node.js spider engine.
publish_to: 'none'
version: 1.2.1+6
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  provider: ^6.1.1
  http: ^1.2.0
  webview_flutter: ^4.8.0
  wakelock_plus: ^1.2.1
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  share_plus: ^7.0.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.3
  connectivity_plus: ^6.0.2
  device_info_plus: ^10.0.2
  package_info_plus: ^7.1.0
  permission_handler: ^11.1.0
  url_launcher: ^6.2.5
  screen_brightness: ^0.2.2

  # Video player (federated plugin; Android + Apple backends)
  yl_player:
    path: ../packages/yl_player

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/js/node-main-template.js
    - assets/js/config-center-dpad.js
    - assets/js/node-intl-polyfill.js
    - assets/images/logo.png
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
