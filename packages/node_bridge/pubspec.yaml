name: node_bridge
description: Embedded Node.js runtime bridge for TVS (nodejs-mobile JNI / NodeMobile.framework).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.tvs.nodebridge
        pluginClass: NodeBridgePlugin
      ios:
        pluginClass: NodeBridgePlugin
