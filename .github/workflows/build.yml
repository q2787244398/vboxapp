name: Build

# 每次 main 分支代码变动：
#   1. 计算下一个版本号（pubspec.yaml 的 X.Y.Z+N 每次 +1）
#   2. 快速静态分析（ubuntu，约 1-2 分钟）—— 失败则不再消耗 macOS/Windows 额度
#   3. Android / iOS / macOS / Windows 四端并行编译
#   4. 版本号回写 main + 打 tag + 发 Release
#
# 版本号传播：Flutter 以 pubspec.yaml 为唯一版本源，自动注入
#   Android(versionName/versionCode) / iOS 与 macOS(CFBundleShortVersionString/CFBundleVersion)，
#   Windows 的 Runner.rc 由 _scripts/bump_version.py 单独对齐。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tvs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------- 1. 计算本次构建的版本号 ----------
  version:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      build: ${{ steps.next.outputs.build }}
      full: ${{ steps.next.outputs.full }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute next version
        id: next
        run: |
          out="$(python3 _scripts/bump_version.py --dry-run)"
          echo "$out"
          version="$(printf '%s\n' "$out" | sed -n 's/^version=//p')"
          build="$(printf '%s\n' "$out" | sed -n 's/^build=//p')"
          tag="$(printf '%s\n' "$out" | sed -n 's/^tag=//p')"
          {
            echo "version=$version"
            echo "build=$build"
            echo "full=$version+$build"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  # ---------- 2. 快速静态分析门禁 ----------
  analyze:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get
      - name: Show resolved dependency versions
        working-directory: flutter
        run: flutter pub deps --style=compact || true
      - name: flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      # 插件包是独立 package，flutter analyze 不会覆盖它。
      # 之前 macOS 构建就因这里的 const 默认值错误失败，故单独分析。
      - name: flutter analyze (yl_player plugin)
        working-directory: packages/yl_player
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

  # ---------- 3. 四端并行编译 ----------
  build:
    needs: [version, analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            artifact_name: tvs-android
            build_cmd: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/
          - os: macos-latest
            platform: ios
            artifact_name: tvs-ios
            build_cmd: flutter build ios --release --no-codesign
            artifact_path: build/ios/iphoneos/
          - os: macos-latest
            platform: macos
            artifact_name: tvs-macos
            build_cmd: flutter build macos --release
            artifact_path: build/macos/Build/Products/Release/
          - os: windows-latest
            platform: windows
            artifact_name: tvs-windows
            build_cmd: flutter build windows --release
            artifact_path: build/windows/x64/runner/Release/
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Windows 上首次调用 flutter 会自举工具链（"Building flutter tool..."），
      # 若外层是 pwsh 再套 bash，stdout 管道会被提前关闭，导致
      # "writeFrom failed ... The pipe is being closed (errno 232)" 并死循环重试。
      # 显式指定 bash，让 runner 直接用 Git Bash 执行（与 action 自身 setup.sh 一致）。
      - name: Bootstrap Flutter tool
        shell: bash
        run: flutter --version
        timeout-minutes: 15

      - name: Prepare platform scaffolding
        shell: bash
        run: bash _scripts/ci_prepare.sh ${{ matrix.platform }} ${{ needs.version.outputs.full }}
        timeout-minutes: 25

      - name: Build (${{ matrix.platform }})
        working-directory: flutter
        shell: bash
        run: ${{ matrix.build_cmd }}
        timeout-minutes: 60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.version.outputs.full }}
          path: flutter/${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  # ---------- 4. 版本号回写 + 打 tag 发 Release ----------
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Pack artifacts
        run: |
          cd dist
          for d in */; do
            zip -qr "${d%/}.zip" "$d"
          done
          ls -lh

      - name: Commit version bump back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 _scripts/bump_version.py --set "${{ needs.version.outputs.full }}"
          git add -u
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
          else
            git commit -m "chore(release): v${{ needs.version.outputs.version }} [skip ci]"
            git push
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            dist/*.zip \
            --title "TVS v${{ needs.version.outputs.version }}" \
            --notes "自动构建发布 — 版本 ${{ needs.version.outputs.version }} (build ${{ needs.version.outputs.build }})" \
            || gh release upload "${{ needs.version.outputs.tag }}" dist/*.zip --clobber
